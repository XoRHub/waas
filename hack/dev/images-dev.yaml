# Dev catalog — mirrors gitops/governance/images.yaml, pointed at the
# published registry images (ghcr.io/xorhub/waas-workspace-images/*, that
# repo's catalogs/<X.Y>/catalog.yaml) by default: no local build/import
# needed. For local iteration on a waas-workspace-images change, `make
# dev-load-images LOCAL_IMAGES="firefox devtools"` builds (via the sibling
# checkout, see WAAS_WORKSPACE_IMAGES_DIR in the Makefile) and imports
# waas-local/<name>:dev into k3d — point the matching
# WorkspaceTemplate's `image:` at that tag yourself to actually run it.
apiVersion: waas.xorhub.io/v1alpha1
kind: WorkspaceImage
metadata:
  name: ubuntu-xfce
spec:
  displayName: "Ubuntu 24.04 — XFCE"
  description: "Bureau XFCE complet (VNC)."
  image: ghcr.io/xorhub/waas-workspace-images/ubuntu-desktop-noble:0.6.0
  protocols: [vnc]
  architectures: [amd64, arm64]
  enabled: true
  resources:
    default: { cpu: 500m, memory: 1Gi }
    min:     { cpu: 250m, memory: 512Mi }
    max:     { cpu: "2",  memory: 4Gi }
# One ref, one entry: FindImage returns the first exact match, so a second
# WorkspaceImage approving the SAME ref would silently shadow this one's
# protocol envelope (ProtocolMismatch naming an image the template never
# picked).
---
apiVersion: waas.xorhub.io/v1alpha1
kind: WorkspaceImage
metadata:
  name: ubuntu-firefox
spec:
  displayName: "Firefox (navigation isolée)"
  description: "Firefox durci par policies.json, session jetable idéale."
  image: ghcr.io/xorhub/waas-workspace-images/firefox:0.6.0
  protocols: [vnc]
  architectures: [amd64]
  enabled: true
  resources:
    default: { cpu: 500m, memory: 1536Mi }
    max:     { cpu: "2",  memory: 3Gi }
---
# Static copy of one catalog-kasmweb.yaml entry (what waas-workspace-images
# publishes daily), with the `kasmvnc` block read from
# kasmweb/terminal:1.19.0 itself (KasmVNC 1.5.1, kasmvnc_defaults.yaml
# verbatim). Display/prefill data only. Ordered BEFORE the WorkspaceImage
# below: it is the catalog ConfigMap that image's `catalog.from.configMapKeyRef`
# names, and the CatalogSyncWorker's watch fires on the WorkspaceImage as
# soon as it is created — if the ConfigMap did not exist yet, that first
# sync failed ("configmaps \"kasm-catalog-dev\" not found") and only
# retried on the 6h ticker, leaving the template editor without defaults
# until then.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kasm-catalog-dev
data:
  catalog.yaml: |
    apiVersion: waas.xorhub.io/catalog/v1
    images:
      - image: docker.io/kasmweb/terminal:1.19.0
        os: linux
        app: terminal
        version: "1.19.0"
        icon: terminal
        displayName: Kasm Terminal
        architectures: [amd64, arm64]
        profile: normal
        recommended:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
        kasmvnc:
          version: "1.5.1"
          defaults: |
            ---
            desktop:
              resolution:
                width: 1024
                height: 768
              allow_resize: true
              pixel_depth: 24
              gpu:
                hw3d: false
                drinode: /dev/dri/renderD128

            network:
              protocol: http
              interface: 0.0.0.0
              websocket_port: auto
              use_ipv4: true
              use_ipv6: true
              udp:
                public_ip: 127.0.0.1
                port: auto
                payload_size: auto
                stun_server: auto
              ssl:
                pem_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
                pem_key: /etc/ssl/private/ssl-cert-snakeoil.key
                require_ssl: true
              # unix_relay:
              #   name:
              #   path:

            user_session:
              # session_type: shared
              new_session_disconnects_existing_exclusive_session: false
              concurrent_connections_prompt: false
              concurrent_connections_prompt_timeout: 10
              idle_timeout: never

            keyboard:
              remap_keys:
              # - 0x22->0x40
              ignore_numlock: false
              raw_keyboard: false

            # Mouse, trackpad, etc.
            pointer:
              enabled: true
              # Force all clients into game mode (direct-drive relative mouse) on connect.
              # Useful for game-focused workspace images where pointer lock is always desired.
              game_mode: false

            runtime_configuration:
              allow_client_to_override_kasm_server_settings: true
              allow_override_standard_vnc_server_settings: true
              allow_override_list:
                - pointer.enabled
                - data_loss_prevention.clipboard.server_to_client.enabled
                - data_loss_prevention.clipboard.client_to_server.enabled
                - data_loss_prevention.clipboard.server_to_client.primary_clipboard_enabled

            logging:
              log_writer_name: all
              log_dest: logfile
              # 0 - minimal verbosity, 100 - most verbose
              level: 30

            security:
              brute_force_protection:
                blacklist_threshold: 5
                blacklist_timeout: 10

            data_loss_prevention:
              visible_region:
                # top: 10
                # left: 10
                # right: 40
                # bottom: 40
                concealed_region:
                  allow_click_down: false
                  allow_click_release: false
              clipboard:
                delay_between_operations: none
                allow_mimetypes:
                  - chromium/x-web-custom-data
                  - text/html
                  - image/png
                # Add to docs: Cut buffers and CLIPBOARD selection.
                server_to_client:
                  enabled: true
                  size: unlimited
                  primary_clipboard_enabled: false
                client_to_server:
                  enabled: true
                  size: unlimited
              keyboard:
                enabled: true
                rate_limit: unlimited
              watermark:
                # image: /etc/kasmvnc/picture.png
                # location: 10,10
                # tint: 255,20,20,128
                # repeat_spacing: 10
                #text:
                  # template: "${USER} %H:%M"
                  # font: auto
                  # font_size: 48
                  # timezone_name: Australia/Adelaide
                  # angle: 0
              logging:
                # "verbose" SETTING LOGS YOUR PRIVATE INFORMATION. Keypresses and clipboard content
                level: off

            encoding:
              max_frame_rate: 60
              full_frame_updates: none
              rect_encoding_mode:
                min_quality: 7
                max_quality: 8
                consider_lossless_quality: 10
                rectangle_compress_threads: auto

              video_encoding_mode:
                jpeg_quality: -1
                webp_quality: -1
                max_resolution:
                  width: 1920
                  height: 1080
                enter_video_encoding_mode:
                  time_threshold: 5
                  area_threshold: 45%
                exit_video_encoding_mode:
                  time_threshold: 3
                logging:
                  level: off
                scaling_algorithm: progressive_bilinear
                webp_encoding_time: 30

              video_streaming_mode:
                codec: auto

              compare_framebuffer: auto
              zrle_zlib_level: auto
              hextile_improved_compression: true
              scrolling:
                detect_vertical_scrolling: false
                detect_horizontal_scrolling: false
                scroll_detect_threshold: 25%

            server:
              http:
                headers:
                  - Cross-Origin-Embedder-Policy=require-corp
                  - Cross-Origin-Opener-Policy=same-origin
                httpd_directory: /usr/share/kasmvnc/www
              advanced:
                x_font_path: auto
                kasm_password_file: ${HOME}/.kasmpasswd
                x_authority_file: auto
              auto_shutdown:
                no_user_session_timeout: never
                active_user_session_timeout: never
                inactive_user_session_timeout: never
              allow_environment_variables_to_override_config_settings: false

            command_line:
              prompt: true
---
# Official Kasm images, pulled straight from Docker Hub (nothing local to
# build/load): the kasmvnc protocol path. Registry mode with a static
# catalog (the ConfigMap above) so the template editor's KasmVNC section
# can read the image's own defaults (catalog `kasmvnc` hint) offline —
# terminal is the lightest kasmweb image and is published multi-arch.
# Name kept: gitops/governance/policies.yaml lists it by name.
apiVersion: waas.xorhub.io/v1alpha1
kind: WorkspaceImage
metadata:
  name: kasm-terminal
spec:
  displayName: "Kasm Terminal"
  description: "Terminal web (image officielle kasmweb, accès KasmVNC natif)."
  registry: docker.io/kasmweb
  tagPolicy: tag
  protocols: [kasmvnc]
  architectures: [amd64, arm64]
  enabled: true
  resources:
    default: { cpu: 500m, memory: 1Gi }
    min:     { cpu: 250m, memory: 512Mi }
    max:     { cpu: "2",  memory: 3Gi }
  catalog:
    from:
      configMapKeyRef:
        name: kasm-catalog-dev
