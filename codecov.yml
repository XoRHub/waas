# Per-component coverage (see docs/ci-github.md). Flags mirror the images
# built by ci-images.yml (operator, api-server, wwt, frontend) plus
# "shared", a Go module with no image of its own.
#
# carryforward: true is required because ci-go.yml/ci-frontend.yml only
# test the modules a commit actually touched (see the `changes` job in
# ci.yml) — without it, an untouched component's coverage would drop to
# 0%/missing on every PR that doesn't happen to touch it.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # informational, not off: the diff's own new lines get a number on
    # every PR, and none of them blocks a merge.
    #
    # `off` was right when the frontend sat at 7.9% and any patch status
    # would have been red on every PR, so the signal would have been
    # trained away rather than read. That is no longer the case, and the
    # project status alone does not replace it: with ~3 700 statements in
    # api-server, its 1% band absorbs ~50 entirely uncovered new lines
    # before it turns red — and a wave lands as many small PRs, each
    # fitting inside that band with room to spare.
    patch:
      default:
        informational: true

flags:
  operator:
    paths: [operator/]
    carryforward: true
  api-server:
    paths: [api-server/]
    carryforward: true
  wwt:
    paths: [wwt/]
    carryforward: true
  frontend:
    paths: [frontend/src/]
    carryforward: true
  shared:
    paths: [shared/]
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, condensed_footer"
  behavior: default
  require_changes: false
