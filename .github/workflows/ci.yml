# WaaS monorepo pipeline — GitHub is the sole and canonical forge (the
# GitLab pipeline has been retired).
# Full picture in docs/ci-github.md.
#
#   PR:    selective per-component gates (dorny/paths-filter drives the
#          change scopes) — lint + tests + security
#          + image builds (NOT pushed, amd64 scanned locally)
#   main:  same gates, ALL images built and pushed as <short-sha>
#          (+ moving `edge` tag) — a release PROMOTES the images of the
#          released SHA, so every main commit must carry the full set
#   release: release-please (manifest mode) runs at the END of the main
#          pipeline — only on the run whose commit is still main's tip
#          (it decides from main's CURRENT head via the API, not from
#          GITHUB_SHA, so a stale run would tag a commit it never built).
#          When its release PR merges it tags vX.Y.Z and the promote job
#          checks out THAT tag and re-tags the already-built-and-scanned
#          <short-sha> manifest lists of the tag's commit as the bare
#          X.Y.Z image tag (the "v" stays on the git tag only) — never a
#          rebuild — then cosign-signs the digests (keyless OIDC), adds a
#          moving `latest` tag (the newest official release only — never
#          confused with the `edge` dev pointer above) and appends the
#          digest table to the GitHub Release. Chaining promotion in the
#          SAME workflow run (gated on the release_created output)
#          sidesteps the GITHUB_TOKEN anti-recursion rule — no PAT/App
#          needed.
#   replay: workflow_dispatch with `tag` and/or `chart_tag` re-runs ONLY
#          the matching promotion job(s) for an existing release (e.g. a
#          promotion that failed after the tag was cut):
#            gh workflow run ci.yml -f tag=v0.6.0 -f chart_tag=chart-0.6.0
#
# This file is the orchestrator: path filtering (`changes`) plus the
# jobs that must stay HERE — chart-oci (must not gate release-please;
# a workflow_call job only succeeds if every job inside it does),
# release-please, promote and promote-chart (release-please -> promote
# chaining needs the SAME run; promote's cosign signature also records
# THIS file's path via the OIDC job_workflow_ref claim — moving it
# would break the --certificate-identity-regexp in docs/ci-github.md).
# Everything else is delegated to reusable workflows (`workflow_call`)
# so each domain is reviewable on its own: ci-go.yml, ci-frontend.yml,
# ci-helm.yml, ci-security.yml, ci-images.yml.
#
# Multi-arch: one native amd64 leg (ubuntu-latest) + one arm64 leg whose
# runner is picked by the WAAS_BUILD_STRATEGY repository variable:
#   native → ubuntu-24.04-arm (free on public repos)
#   anything else / unset → ubuntu-latest under QEMU (safe default)
# A merge job assembles the manifest list.
#
# Actions are pinned by commit SHA (Renovate: helpers:pinGitHubActionDigests).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual promotion replay — see the `replay:` header note. Both inputs
  # optional; every non-promotion job skips on this event.
  workflow_dispatch:
    inputs:
      tag:
        description: "App release tag to promote (vX.Y.Z); its Release must exist"
        type: string
        required: false
      chart_tag:
        description: "Chart release tag to promote (chart-X.Y.Z); its Release must exist"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ci-replay' || format('ci-{0}', github.ref) }}
  # Cancel superseded PR runs only. A RUNNING main run is never
  # cancelled, but GitHub keeps a single PENDING run per group: a newer
  # main push replaces a run still waiting, and that run's images are
  # then never built (see the release-please comment for the recovery).
  # A replay gets its own group so it neither evicts nor is evicted by a
  # queued main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # Path filtering. PR pipelines are selective; push pipelines on main
  # force EVERYTHING (build-all invariant: release promotion needs the
  # complete image set at any taggable SHA).
  # ------------------------------------------------------------------
  changes:
    # A dispatched replay only promotes: skipping `changes` skips every
    # job that needs it (go/frontend/helm/images), hence no build/push.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go_lint: ${{ steps.plan.outputs.go_lint }}
      go_test: ${{ steps.plan.outputs.go_test }}
      images: ${{ steps.plan.outputs.images }}
      frontend: ${{ steps.plan.outputs.frontend }}
      helm: ${{ steps.plan.outputs.helm }}
      drift: ${{ steps.plan.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Change scopes follow the REAL dependency graph (go.mod replace
      # directives):
      #   api-server -> operator + shared, wwt -> shared,
      #   kasmvnc-sidecar -> shared, operator -> shared, test/smoke -> operator.
      # &ci is the global-rebuild trap: shared CI config changes retrigger
      # every scope. Keep it FIRST in every list.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - '.github/workflows/**'
            go-global: &go-global
              - *ci
              - 'go.work'
              - 'go.work.sum'
              - '.golangci.yml'
            shared:
              - *go-global
              - 'shared/**'
            operator:
              - *go-global
              - 'operator/**'
            api-server:
              - *go-global
              - 'api-server/**'
            wwt:
              - *go-global
              - 'wwt/**'
            kasmvnc-sidecar:
              - *go-global
              - 'kasmvnc-sidecar/**'
            smoke:
              - *go-global
              - 'test/smoke/**'
            # Editor CRD schemas: a hand edit must face the same drift
            # gate a CRD change does (see the DRIFT composition below).
            crd-schemas:
              - *ci
              - 'crd-schemas/**'
            frontend:
              - *ci
              - 'frontend/**'
            helm:
              - *ci
              - 'helm/**'
              - 'gitops/**'
              - 'hack/dev/*.yaml'
              - 'hack/ci/**'
              - 'operator/api/**'
              - 'operator/config/**'
            # operator's Dockerfile copies shared/.
            image-operator:
              - *ci
              - 'operator/**'
              - 'shared/**'
            # api-server's Dockerfile copies shared/ + operator/{api,pkg}.
            image-api-server:
              - *ci
              - 'api-server/**'
              - 'shared/**'
              - 'operator/api/**'
              - 'operator/pkg/**'
              - 'operator/go.mod'
              - 'operator/go.sum'
            # wwt's Dockerfile copies shared/.
            image-wwt:
              - *ci
              - 'wwt/**'
              - 'shared/**'
            # kasmvnc-sidecar's Dockerfile copies shared/.
            image-kasmvnc-sidecar:
              - *ci
              - 'kasmvnc-sidecar/**'
              - 'shared/**'
            image-frontend:
              - *ci
              - 'frontend/**'
      - name: Compose job matrices
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          F_SHARED: ${{ steps.filter.outputs.shared }}
          F_OPERATOR: ${{ steps.filter.outputs.operator }}
          F_API: ${{ steps.filter.outputs.api-server }}
          F_WWT: ${{ steps.filter.outputs.wwt }}
          F_AGENT: ${{ steps.filter.outputs.kasmvnc-sidecar }}
          F_SMOKE: ${{ steps.filter.outputs.smoke }}
          F_CRDSCHEMAS: ${{ steps.filter.outputs.crd-schemas }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_HELM: ${{ steps.filter.outputs.helm }}
          F_IMG_OPERATOR: ${{ steps.filter.outputs.image-operator }}
          F_IMG_API: ${{ steps.filter.outputs.image-api-server }}
          F_IMG_WWT: ${{ steps.filter.outputs.image-wwt }}
          F_IMG_AGENT: ${{ steps.filter.outputs.image-kasmvnc-sidecar }}
          F_IMG_FRONTEND: ${{ steps.filter.outputs.image-frontend }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # main: full pipeline, no exceptions (promotion invariant).
            F_SHARED=true F_OPERATOR=true F_API=true F_WWT=true F_AGENT=true F_SMOKE=true
            F_FRONTEND=true F_HELM=true
            F_IMG_OPERATOR=true F_IMG_API=true F_IMG_WWT=true F_IMG_AGENT=true F_IMG_FRONTEND=true
          fi

          LINT=() ; TEST=()
          [ "$F_SHARED" = "true" ] && { LINT+=(shared); TEST+=(shared); }
          # Dependents: a change in a dependency re-gates the dependent.
          if [ "$F_OPERATOR" = "true" ] || [ "$F_SHARED" = "true" ]; then
            LINT+=(operator); TEST+=(operator)
          fi
          if [ "$F_API" = "true" ] || [ "$F_SHARED" = "true" ] || [ "$F_OPERATOR" = "true" ]; then
            LINT+=(api-server); TEST+=(api-server)
          fi
          if [ "$F_WWT" = "true" ] || [ "$F_SHARED" = "true" ]; then
            LINT+=(wwt); TEST+=(wwt)
          fi
          if [ "$F_AGENT" = "true" ] || [ "$F_SHARED" = "true" ]; then
            LINT+=(kasmvnc-sidecar); TEST+=(kasmvnc-sidecar)
          fi
          # test/smoke is lint-only: its tests need a live cluster.
          if [ "$F_SMOKE" = "true" ] || [ "$F_OPERATOR" = "true" ]; then
            LINT+=(test/smoke)
          fi

          to_json() {
            # ${arr[@]:-} yields one empty arg for an empty array: drop it.
            if [ "$#" -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -cRn '[inputs | select(length > 0)]'; fi
          }
          echo "go_lint=$(to_json "${LINT[@]:-}")" >> "$GITHUB_OUTPUT"
          echo "go_test=$(to_json "${TEST[@]:-}")" >> "$GITHUB_OUTPUT"

          img() { [ "$4" = "true" ] && printf '{"name":"%s","context":"%s","dockerfile":"%s"}\n' "$1" "$2" "$3" || true; }
          {
            img operator        .        operator/Dockerfile        "$F_IMG_OPERATOR"
            img api-server      .        api-server/Dockerfile      "$F_IMG_API"
            img wwt             .        wwt/Dockerfile             "$F_IMG_WWT"
            img kasmvnc-sidecar .        kasmvnc-sidecar/Dockerfile "$F_IMG_AGENT"
            img frontend        frontend frontend/Dockerfile        "$F_IMG_FRONTEND"
          } | jq -cs . | sed 's/^/images=/' >> "$GITHUB_OUTPUT"

          echo "frontend=${F_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "helm=${F_HELM}" >> "$GITHUB_OUTPUT"
          # shared/catalog feeds the generated CRD/schema drift check
          # (gen-catalog-schema) just like operator/api/v1alpha1 does.
          DRIFT=false
          [ "$F_OPERATOR" = "true" ] && DRIFT=true
          [ "$F_SHARED" = "true" ] && DRIFT=true
          # crd-schemas/ is drift-checked output: a hand edit alone must
          # not dodge the gate (push runs always set DRIFT via operator).
          [ "$F_CRDSCHEMAS" = "true" ] && DRIFT=true
          echo "drift=${DRIFT}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Delegated domains — see ci-*.yml. Each call job's `if` mirrors the
  # exact condition its jobs used to carry inline.
  # ------------------------------------------------------------------
  go:
    needs: changes
    if: needs.changes.outputs.go_lint != '[]' || needs.changes.outputs.go_test != '[]' || needs.changes.outputs.drift == 'true'
    permissions:
      contents: read
      id-token: write # passed through to ci-go.yml's keyless Codecov upload
    uses: ./.github/workflows/ci-go.yml
    with:
      go_lint: ${{ needs.changes.outputs.go_lint }}
      go_test: ${{ needs.changes.outputs.go_test }}
      drift: ${{ needs.changes.outputs.drift == 'true' }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write # passed through to ci-frontend.yml's keyless Codecov upload
    uses: ./.github/workflows/ci-frontend.yml

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    uses: ./.github/workflows/ci-helm.yml

  # Unconditional on every PR and main push: a gate that can be skipped
  # by touching the "right" files is not a gate.
  security:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/ci-security.yml

  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml
    with:
      images: ${{ needs.changes.outputs.images }}
      push: ${{ github.event_name == 'push' }}

  # ------------------------------------------------------------------
  # OCI chart push — dev build off every main commit. No dedicated Helm
  # chart registry is planned: the chart is pushed as an OCI artifact to
  # ghcr.io (same registry as the component images), under a `charts/`
  # sub-path. `-main.<short-sha>` is a valid SemVer prerelease so it
  # never collides with a released `X.Y.Z` tag (see the `promote` job).
  # Deliberately NOT delegated to ci-helm.yml and NOT in release-please's
  # `needs`: a chart-oci failure must not block an app release.
  # ------------------------------------------------------------------
  chart-oci:
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: vars
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: helm # version pinned in .mise.toml
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push dev chart
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          CHART_VERSION="$(helm show chart helm/waas | awk '/^version:/{print $2}')"
          DEV_VERSION="${CHART_VERSION}-main.${{ steps.vars.outputs.sha }}"
          helm package helm/waas --version "$DEV_VERSION" -d dist
          helm push "dist/waas-${DEV_VERSION}.tgz" "oci://$REGISTRY/${{ steps.vars.outputs.repo }}/charts"
          # Moving `0.0.0-edge` tag: same convenience pointer as the images'
          # `edge` tag (ci-images.yml), mirrored onto the chart artifact.
          # Unlike the images (untagged, no SemVer to satisfy), a bare
          # `edge` tag isn't valid SemVer, so `helm pull --version edge`
          # (and kustomize's helmCharts, which goes through the same Helm
          # SDK validation) reject it outright. `0.0.0-edge` is a valid
          # SemVer prerelease with a fixed name — stable regardless of
          # Chart.yaml's own version bumps.
          docker buildx imagetools create \
            -t "$REGISTRY/${{ steps.vars.outputs.repo }}/charts/waas:0.0.0-edge" \
            "$REGISTRY/${{ steps.vars.outputs.repo }}/charts/waas:$DEV_VERSION"

  # ------------------------------------------------------------------
  # Release. release-please (manifest mode, SemVer, conventional commits)
  # maintains TWO independent release PRs (separate-pull-requests: true),
  # like DrummyFloyd/crunchy-userinit-controller:
  #   "."         the app — images, the vX.Y.Z git tag ArgoCD tracks
  #               (Application targetRevision, deploys straight from
  #               git), and Chart.yaml's appVersion (extra-files).
  #   "helm/waas" the chart's OWN SemVer (Chart.yaml `version`), only
  #               used for the OCI chart artifact pushed for external
  #               `helm install --version` consumers — free to diverge
  #               from the app version between chart releases.
  # Merging either PR creates that package's tag + GitHub Release.
  # needs: gates release-please on the full green pipeline, so a tag
  # can only ever point at a releasable SHA.
  #
  # Only the run for main's CURRENT tip may run it: release-please reads
  # main's head via the API, not GITHUB_SHA, so a run that main has
  # already moved past would cut the release for a commit it never
  # checked out (that is how v0.6.0 got tagged by the run of an older
  # commit, whose promote then failed on appVersion, while the release
  # commit's own run saw "release exists" and promoted nothing). Main
  # runs are serialized (concurrency group) and never cancelled while
  # running, but a run still PENDING is replaced by a newer main push:
  # the tip run may then tag a commit whose <short-sha> images were
  # never built. promote's "source missing" check turns that into a
  # loud failure instead of a wrong promotion; a replay alone would
  # fail forever. Recovery: re-run that commit's cancelled CI run
  # (`gh run rerun <id>` — it rebuilds/pushes <short-sha>, and its
  # release-please self-skips as non-tip), then dispatch the replay.
  # The gate is not a lock either: a release PR merging in the seconds
  # between this check and release-please's own API call still tags a
  # commit whose run is only queued — same failure; once that queued
  # run is green the replay alone suffices.
  # ------------------------------------------------------------------
  release-please:
    needs: [go, frontend, helm, security, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      chart_release_created: ${{ steps.rp.outputs['helm/waas--release_created'] }}
      chart_tag_name: ${{ steps.rp.outputs['helm/waas--tag_name'] }}
    steps:
      - name: Skip unless this run's commit is still main's tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "$HEAD" = "$GITHUB_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=release-please skipped::main moved to ${HEAD::7} since ${GITHUB_SHA::7}; the tip's run cuts the release once it is green (a red tip delays it to the next green tip)"
            echo "tip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: steps.tip.outputs.tip == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Promotion of already-tested artifacts, never a rebuild: verify ->
  # re-tag -> keyless cosign -> digest table appended to the Release
  # notes. Signing verification:
  #   cosign verify \
  #     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/\.github/workflows/ci\.yml@.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     <image>@<digest>
  #
  # Both promotion jobs work from the release TAG's commit, never from
  # this run's GITHUB_SHA: release-please may tag an older commit than
  # the one this run checked out (see the release-please comment), and
  # a workflow_dispatch replay runs on main's tip. `!cancelled()` is
  # required for the replay path (release-please is skipped there, which
  # would otherwise skip its dependents too); on push the job still only
  # runs when release-please succeeded AND created that package's release.
  # The replay branch is pinned to main: `gh workflow run --ref <branch>`
  # must not run a modified promote with packages/id-token write.
  promote:
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # edit the Release notes
      packages: write  # push the X.Y.Z image tags
      id-token: write  # keyless cosign (Fulcio/Rekor)
    env:
      COMPONENTS: operator api-server wwt kasmvnc-sidecar frontend
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Trivially true on push; on a replay it rejects a typo'd or
      # unreleased tag before anything is pushed (the notes get edited).
      - name: Verify the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}  # qualified: a same-named branch cannot shadow the tag
      - name: Resolve the promotion source (the tag's commit, not this run's)
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          { echo "SRC_SHA=$SHA"; echo "SHORT=${SHA::7}"; } >> "$GITHUB_ENV"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify promotion preconditions
        run: |
          set -euo pipefail
          # Only the git tag carries the "v" (ArgoCD contract); the image
          # tags and Chart.yaml's appVersion (the default image tag) are
          # bare SemVer, hence VERSION=${TAG#v} alongside $TAG.
          VERSION="${TAG#v}"
          # The chart at the released SHA must reference the release.
          # release-please bumps appVersion via the x-release-please
          # marker in Chart.yaml — this guards against the marker being
          # dropped. The chart's own `version` field is a separate
          # package (helm/waas) and is NOT checked here.
          grep -Eq "^appVersion:[[:space:]]*\"${VERSION}\"[[:space:]]*$" helm/waas/Chart.yaml \
            || { echo "FATAL Chart.yaml 'appVersion' must be \"${VERSION}\""; exit 1; }
          for c in $COMPONENTS; do
            IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}/$c"
            docker buildx imagetools inspect "$IMAGE:$SHORT" >/dev/null \
              || { echo "::error title=promotion source missing::$IMAGE:$SHORT not found. If the CI run of ${SRC_SHA::7} was cancelled while pending (replaced by a newer main push), re-run it first (gh run rerun <run-id> — it rebuilds/pushes $SHORT, its release-please self-skips as non-tip), then replay with gh workflow run ci.yml -f tag=$TAG"; exit 1; }
            # Release tags are immutable; tolerate an identical re-run
            # (idempotent retry after a partial failure). Only a "not
            # found" probe means the tag is free: any other failure (ghcr
            # outage, auth) must not be read as free and overwritten.
            if OUT=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION" 2>&1); then
              SRC=$(docker buildx imagetools inspect "$IMAGE:$SHORT" --format '{{.Manifest.Digest}}')
              DST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
              [ "$SRC" = "$DST" ] \
                || { echo "FATAL $IMAGE:$VERSION already exists with a DIFFERENT digest — release tags are immutable"; exit 1; }
            else
              grep -q 'not found' <<<"$OUT" || { echo "FATAL cannot probe $IMAGE:$VERSION: $OUT"; exit 1; }
            fi
          done
      - name: Promote and sign
        run: |
          set -euo pipefail
          # Image tags are the bare SemVer; only the git tag (and the
          # cosign version= annotation below) keeps the "v".
          VERSION="${TAG#v}"
          printf '\n## Images\n\n| Composant | Image (digest) |\n|---|---|\n' > release-images.md
          for c in $COMPONENTS; do
            IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}/$c"
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$SHORT"
            DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
            cosign sign --yes \
              -a version="$TAG" -a revision="$SRC_SHA" \
              "$IMAGE@$DIGEST"
            # `latest` always points at the newest OFFICIAL release only —
            # never the `edge` dev pointer (ci-images.yml). Same digest as
            # $VERSION, so no separate cosign signature is needed.
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
            printf '| %s | `%s@%s` |\n' "$c" "$IMAGE" "$DIGEST" >> release-images.md
          done
      - name: Append digest table to the Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > notes.md
          # A replay of an already-promoted release must not append twice.
          if grep -q '^## Images' notes.md; then
            echo "Release notes already carry the digest table — unchanged"; exit 0
          fi
          cat release-images.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md
      # Advisory only, and deliberately so: a waas release must never
      # depend on the state of another repo. The chart derives both
      # catalogs.* URLs from this release's appVersion minor, and
      # waas-workspace-images publishes them when its own
      # release-sync.yml bump PR is merged there. Until that lands the
      # URLs 404 — the registry approvals still hold, so the cost is a
      # picker without metadata. This step only makes that visible on
      # release day instead of letting it surface as an empty portal.
      - name: Warn if this minor's bootstrap catalogs are not published yet
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          MINOR="${VERSION%.*}"
          BASE="https://raw.githubusercontent.com/XoRHub/waas-workspace-images/main/catalogs/${MINOR}"
          for f in catalog.yaml catalog-kasmweb.yaml; do
            if curl -fsSL -o /dev/null "${BASE}/${f}"; then
              echo "catalogs/${MINOR}/${f}: published"
            else
              echo "::warning title=Bootstrap catalog missing::catalogs/${MINOR}/${f} is not published in waas-workspace-images yet, so catalogs.* will 404 for this release until its release-sync.yml bump PR is merged there."
            fi
          done

  # Independent OCI publish of the chart, gated on the "helm/waas"
  # package's OWN release (its SemVer, not the app's). No repackage-
  # with-override: the committed Chart.yaml at the tagged SHA IS the
  # release. No dedicated Helm chart registry planned — same ghcr.io
  # registry as the images, `charts/` sub-path. External
  # `helm pull`/`helm install --version` consumers only; ArgoCD deploys
  # from git and never reads this artifact.
  promote-chart:
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.chart_release_created == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.chart_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # gh release view
      packages: write  # push the chart OCI artifact
    env:
      CHART_TAG: ${{ inputs.chart_tag || needs.release-please.outputs.chart_tag_name }}
    steps:
      - name: Verify the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$CHART_TAG" -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.CHART_TAG }}  # qualified: a same-named branch cannot shadow the tag
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: helm # version pinned in .mise.toml
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          CHART_VERSION="$(helm show chart helm/waas | awk '/^version:/{print $2}')"
          # The tag names the version being published; packaging a
          # checkout whose Chart.yaml says otherwise would push (and
          # overwrite) ANOTHER version — that is how a 0.6.0 release once
          # clobbered the published 0.5.0 artifact.
          [ "$CHART_VERSION" = "${CHART_TAG#chart-}" ] \
            || { echo "FATAL Chart.yaml 'version' is ${CHART_VERSION}, tag ${CHART_TAG} expects ${CHART_TAG#chart-}"; exit 1; }
          CHART_REF="$REGISTRY/${GITHUB_REPOSITORY,,}/charts/waas:$CHART_VERSION"
          # Chart release tags are immutable, like the image tags in
          # `promote`. No identical-re-run tolerance here: `helm package`
          # is not byte-reproducible, so an existing tag always differs.
          # To replay a version that was pushed wrong, delete that ghcr
          # tag by hand first — a deliberate manual step. Only a "not
          # found" probe means the tag is free: any other failure (ghcr
          # outage, auth) must not be read as free and overwritten.
          if OUT=$(docker buildx imagetools inspect --raw "$CHART_REF" 2>&1); then
            echo "FATAL $CHART_REF already exists — chart release tags are immutable"; exit 1
          fi
          grep -q 'not found' <<<"$OUT" || { echo "FATAL cannot probe $CHART_REF: $OUT"; exit 1; }
          helm package helm/waas -d dist
          helm push dist/waas-*.tgz "oci://$REGISTRY/${GITHUB_REPOSITORY,,}/charts"
          # `latest` always points at the newest OFFICIAL chart release —
          # distinct from the `edge` dev pointer (chart-oci job).
          docker buildx imagetools create \
            -t "$REGISTRY/${GITHUB_REPOSITORY,,}/charts/waas:latest" \
            "$CHART_REF"
          echo "Pushed chart $CHART_VERSION for $CHART_TAG"
